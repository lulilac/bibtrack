<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 520px; height: 590px; overflow: hidden; background: #fff; color: #212121; }
      @media (prefers-color-scheme: dark) { html, body { background: #212121; color: #fff; } }
      iframe { border: 0; width: 100%; height: 100%; display: none; }
      #msg { font: 14px system-ui, sans-serif; padding: 24px; }
      code { background: rgba(127,127,127,.2); padding: 1px 4px; border-radius: 4px; }
      #setup { display: none; gap: 8px; padding: 0 24px 24px; font: 14px system-ui, sans-serif; }
      #setup input { flex: 1; min-width: 0; padding: 6px 8px; font: inherit; color: inherit;
        background: transparent; border: 1px solid rgba(127,127,127,.5); border-radius: 4px; }
      #setup button { padding: 6px 12px; font: inherit; cursor: pointer; border-radius: 4px;
        border: 1px solid rgba(127,127,127,.5); background: rgba(127,127,127,.15); color: inherit; }
    </style>
  </head>
  <body>
    <div id="msg">Reading page…</div>
    <div id="setup">
      <input id="server" type="url" spellcheck="false" placeholder="https://bibtrack.example.org" />
      <button id="save">Save</button>
    </div>
    <iframe id="frame"></iframe>
    <script type="module" src="popup.js"></script>
  </body>
</html>
