<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px system-ui, sans-serif; margin: 0; padding: 16px; }
      label { display: block; margin-bottom: 6px; }
      .row { display: flex; gap: 8px; }
      input { flex: 1; font: inherit; padding: 6px 8px; min-width: 20em; }
      button { font: inherit; padding: 6px 14px; }
      #saved { color: #2a7; margin-top: 8px; min-height: 1.2em; }
      small { color: #888; display: block; margin-top: 10px; }
    </style>
  </head>
  <body>
    <label for="server">bibtrack server address</label>
    <div class="row">
      <input id="server" type="url" spellcheck="false" placeholder="http://localhost:5577" />
      <button id="save">Save</button>
    </div>
    <div id="saved"></div>
    <small>A local server opens inside the toolbar popup; a remote one opens in a new tab.</small>
    <script src="options.js" type="module"></script>
  </body>
</html>
